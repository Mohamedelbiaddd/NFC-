name: Build Flutter APK

on:
  push:
    # main/master for releases; arena/** so a feature branch can produce a
    # testable APK artifact without merging first.
    branches: [main, master, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Dart obfuscation renames every symbol and strips comments so the APK
      # cannot be decompiled back into readable source. Debug symbols are kept
      # separately (never inside the APK) so crash reports stay readable.
      - name: Build release APK (obfuscated)
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/debug-symbols
          --dart-define-from-file=config.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-debug-symbols
          path: build/debug-symbols
          if-no-files-found: warn
          retention-days: 14
