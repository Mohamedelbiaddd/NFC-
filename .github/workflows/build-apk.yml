name: Build Flutter APK

on:
  push:
    # main/master for releases; arena/** so a feature branch can produce a
    # testable APK artifact without merging first.
    branches: [main, master, 'arena/**']
  workflow_dispatch:

permissions:
  # write: publish the APK as a direct download on the "latest" release.
  contents: write
  # id-token: prove to our signing function that this is our own build.
  id-token: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Dart obfuscation renames every symbol and strips comments so the APK
      # cannot be decompiled back into readable source. Debug symbols are kept
      # separately (never inside the APK) so crash reports stay readable.
      # The fixed release key: one signature for every build, so the app can
      # update itself in place. Only pushes to main can fetch it.
      - name: Fetch release signing key
        if: github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tapmaroc-ci-signing" | jq -r .value)
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            https://ikcaingdfybpqrdzucyd.supabase.co/functions/v1/ci-signing > "$RUNNER_TEMP/sig.json"
          jq -r .keystore_b64 "$RUNNER_TEMP/sig.json" | base64 -d > "$RUNNER_TEMP/release.p12"
          PW=$(jq -r .password "$RUNNER_TEMP/sig.json")
          echo "::add-mask::$PW"
          echo "TAPMAROC_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "TAPMAROC_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "TAPMAROC_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/sig.json")" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sig.json"

      # The run number is the build number: the app compares it with
      # version.json on the release to offer an in-app update.
      - name: Build release APK (obfuscated)
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/debug-symbols
          --dart-define-from-file=config.json
          --build-number=${{ github.run_number }}
          --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a direct download (latest release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nfc-studio.apk
          echo "{\"build\": ${{ github.run_number }}, \"sha\": \"${GITHUB_SHA::7}\"}" > version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nfc-studio.apk version.json \
            --title "NFC Studio — latest" \
            --notes "Built from ${GITHUB_SHA::7}. Download nfc-studio.apk and install it." \
            --target "$GITHUB_SHA"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-debug-symbols
          path: build/debug-symbols
          if-no-files-found: warn
          retention-days: 14
