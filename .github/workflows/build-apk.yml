name: Build Flutter APK

on:
  push:
    # main/master for releases; arena/** so a feature branch can produce a
    # testable APK artifact without merging first.
    branches: [main, master, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read
  # id-token: prove to our signing function that this is our own build.
  id-token: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Dart obfuscation renames every symbol and strips comments so the APK
      # cannot be decompiled back into readable source. Debug symbols are kept
      # separately (never inside the APK) so crash reports stay readable.
      # The fixed release key: one signature for every build, so the app can
      # update itself in place. Only pushes to main can fetch it.
      - name: Fetch release signing key
        if: github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tapmaroc-ci-signing" | jq -r .value)
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            https://ikcaingdfybpqrdzucyd.supabase.co/functions/v1/ci-signing > "$RUNNER_TEMP/sig.json"
          jq -r .keystore_b64 "$RUNNER_TEMP/sig.json" | base64 -d > "$RUNNER_TEMP/release.p12"
          PW=$(jq -r .password "$RUNNER_TEMP/sig.json")
          echo "::add-mask::$PW"
          echo "TAPMAROC_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "TAPMAROC_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "TAPMAROC_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/sig.json")" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/sig.json"

      # The signing certificate's fingerprint: the app compares it with its own
      # signature at start-up, and the server refuses a phone whose app
      # reports another one (a rebuilt / tampered APK).
      - name: Certificate fingerprint
        if: github.ref == 'refs/heads/main'
        run: |
          FP=$(keytool -list -v -storetype PKCS12 -keystore "$TAPMAROC_KEYSTORE" \
            -storepass "$TAPMAROC_KEYSTORE_PASSWORD" -alias "$TAPMAROC_KEY_ALIAS" \
            | sed -n 's/^.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          test ${#FP} -eq 64
          echo "CERT_SHA256=$FP" >> "$GITHUB_ENV"

      # The run number is the build number: the app compares it with the
      # published release to offer an in-app update. One APK per processor
      # type keeps each file small (the private bucket takes 50 MB at most).
      - name: Build release APKs (obfuscated, one per ABI)
        run: >
          flutter build apk --release
          --split-per-abi
          --obfuscate
          --split-debug-info=build/debug-symbols
          --dart-define-from-file=config.json
          --build-number=${{ github.run_number }}
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=CERT_SHA256=${{ env.CERT_SHA256 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-app-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

      # The app is not public: the APKs go to a private bucket. Only staff
      # with a valid invitation link (24 h) or a signed-in approved phone
      # receive a short-lived download link.
      - name: Publish to the private release bucket
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          FN=https://ikcaingdfybpqrdzucyd.supabase.co/functions/v1/ci-release
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tapmaroc-ci-release" | jq -r .value)
          BUILD=${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          NAMES=$(ls app-*-release.apk | jq -R . | jq -sc .)
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"action\":\"upload\",\"build\":$BUILD,\"names\":$NAMES}" "$FN" > "$RUNNER_TEMP/urls.json"
          FILES='{}'
          for f in app-*-release.apk; do
            URL=$(jq -r --arg f "$f" '.urls[$f]' "$RUNNER_TEMP/urls.json")
            curl -sf -X PUT -H 'Content-Type: application/vnd.android.package-archive' \
              -H 'x-upsert: true' --data-binary "@$f" "$URL" > /dev/null
            ABI=${f#app-}; ABI=${ABI%-release.apk}
            FILES=$(jq -c --arg abi "$ABI" --arg path "android/$BUILD/$f" \
              --argjson size "$(stat -c %s "$f")" --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + {($abi): {path: $path, size: $size, sha256: $sha}}' <<< "$FILES")
          done
          MANIFEST=$(jq -nc --argjson build "$BUILD" --arg sha "${GITHUB_SHA::7}" \
            --arg cert "$CERT_SHA256" --argjson files "$FILES" \
            '{build: $build, sha: $sha, cert_sha256: $cert, files: $files}')
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"action\":\"publish\",\"manifest\":$MANIFEST}" "$FN"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nfc-admin-debug-symbols
          path: build/debug-symbols
          if-no-files-found: warn
          retention-days: 14
