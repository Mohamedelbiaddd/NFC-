name: nfc_studio
description: Multi-tenant NFC profile management and Android writer.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  nfc_manager: ^4.3.0
  ndef_record: ^1.4.2
  # Card passwords (NTAG21x) are derived from the typed password.
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  # Pick a profile image from the gallery before uploading it to Storage.
  image_picker: ^1.1.2
  # Render the public /p/<slug> link as a QR code for thermal labels.
  qr_flutter: ^4.1.0
  # Save the rendered QR label to the phone gallery for thermal printing.
  gal: ^2.3.0
  # Remembers the chosen app language.
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
